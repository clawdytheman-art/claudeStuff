[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-sleep"
version = "0.1.0"
description = "Better sleep analytics for Garmin watches (Venu 3 and friends)"
requires-python = ">=3.10"
dependencies = [
    "garminconnect>=0.2.19",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]

[project.scripts]
garmin-sleep = "garmin_sleep.cli:main"

[tool.setuptools.packages.find]
include = ["garmin_sleep*"]
